notes:
  - "The split is held out for evaluation and must not be used for threshold or parameter tuning."
  - "The benchmark is retrospective and inherits the source study's model and experimental scope."
  - "A second reviewer must verify the source rows and label semantics before manuscript submission."
  - "The 21 cases are unique by exact FlyWire ID; repeated source rows are deliberately excluded."
