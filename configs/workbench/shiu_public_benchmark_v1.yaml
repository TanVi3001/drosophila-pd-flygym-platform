# Public retrospective benchmark registry for the Workbench prioritization
# method. Labels are author-reported model-vs-experiment agreement labels from
# the source supplement; they are not biological effect labels.
protocol_id: shiu-public-retrospective-v1
source:
  citation: "Shiu et al. (2024), Nature, Supplementary Table 11B"
  doi: "10.1038/s41586-024-07763-9"
  locator: &public_locator "https://www.nature.com/articles/s41586-024-07763-9"
  artifact_locator: "https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41586-024-07763-9/MediaObjects/41586_2024_7763_MOESM2_ESM.xlsx"
  artifact_sha256: "6922E16825AA0C92A28E2A634B073DCAD7641E9C9283C4B9D8EE1E34E6D9B8D9"
  worksheet: "Supp Table 11B Decrease w_syn"
  table_column: "Correct (i.e., aligns with experimental results?)"
  status: public_artifact_verified_locally
  review_status: PENDING_SCIENTIFIC_REVIEW
evaluation_contract:
  status: PENDING_SCIENTIFIC_REVIEW
  target: source_model_experiment_agreement
  description: >-
    The source label records whether the original model prediction aligned with
    the corresponding experimental comparison. Workbench outputs must not be
    interpreted as biological effect labels without a reviewer-approved,
    section-specific mapping.
  required_case_fields:
    - source_section
    - assay
    - stimulus
    - intervention
    - readout
    - source_header_row
  unsupported_cases_must_be_reported_as: unassessable
selection_rule: >-
  Extract the first source row for each exact FlyWire ID in Supplementary Table
  11B Decrease w_syn. Retain 21 unique-ID conditions with a public row-level
  locator and an author-reported 0/1 comparison label. Repeated rows for an ID
  are excluded from this v1 snapshot to prevent target leakage. The
  development split contains source rows 3-15; the held-out split contains
  source rows 16-17, 165, 167, 174-176 and 180. This is a deterministic,
  source-row split, not a random sample.
frozen_at: "2026-09-16T00:00:00+07:00"
min_case_count: 20
precision_at_k: 3
freeze_status: FROZEN
label_policy: >-
  Map source column "Correct (i.e., aligns with experimental results?)" value 1
  to reference_label=positive and value 0 to reference_label=negative. The
  resulting label means reported agreement between the original model
  prediction and the authors' experimental comparison; it does not mean that
  the biological effect itself is positive or negative. No label is inferred
  from the Workbench output.
freeze_commit: null
