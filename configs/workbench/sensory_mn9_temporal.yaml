name: sensory-mn9-temporal-input-v1
hypothesis: The temporal organization of a fixed sugar-input drive changes the computational MN9 response even when the total stimulus rate is declared explicitly.
falsifiable_prediction: A pulsed sugar protocol will produce a different MN9 readout from sustained sugar activation under paired seeds and the same total simulation duration.
assay: sensory_mn9
primary_metric: metrics.readout_rates_hz.720575940660219265
backend: lif_2024

sugar_input_ids: &sugar_input_ids
  - "720575940624963786"
  - "720575940630233916"
  - "720575940637568838"
  - "720575940638202345"
  - "720575940617000768"
  - "720575940630797113"
  - "720575940632889389"
  - "720575940621754367"
  - "720575940621502051"
  - "720575940640649691"
  - "720575940639332736"
  - "720575940616885538"
  - "720575940639198653"
  - "720575940620900446"
  - "720575940617937543"
  - "720575940632425919"
  - "720575940633143833"
  - "720575940612670570"
  - "720575940628853239"
  - "720575940629176663"
  - "720575940611875570"

candidates:
  - candidate_id: no_intervention
    label: No-input computational control
    intervention:
      type: none
    expected_direction: unchanged
  - candidate_id: sustained_sugar
    label: Sustained sugar input at 150 Hz
    target: public_sugar_grn_set
    intervention:
      type: activation
      parameters:
        input_ids: *sugar_input_ids
        stimulus_schedule:
          - start_s: 0.0
            end_s: 1.0
            rate_hz: 150.0
            input_ids: *sugar_input_ids
            label: sustained
    expected_direction: increase
  - candidate_id: pulsed_sugar
    label: Two 250 ms sugar pulses at 150 Hz
    target: public_sugar_grn_set
    intervention:
      type: activation
      parameters:
        input_ids: *sugar_input_ids
        stimulus_schedule:
          - start_s: 0.0
            end_s: 0.25
            rate_hz: 150.0
            input_ids: *sugar_input_ids
            label: pulse_1
          - start_s: 0.5
            end_s: 0.75
            rate_hz: 150.0
            input_ids: *sugar_input_ids
            label: pulse_2
    expected_direction: increase

controls:
  - id: no_intervention
    role: computational_negative_control
  - id: paired_seed
    role: computational_pairing
  - id: equal_declared_duration
    role: protocol_control
    note: Both conditions run for 1 second; the pulse protocol does not imply an equal biological dose or behavior.

sources:
  - citation: Shiu et al. 2024
    locator: https://www.nature.com/articles/s41586-024-07763-9
    status: public_reference
  - citation: Sapkal et al. 2024
    locator: https://www.nature.com/articles/s41586-024-07854-7
    status: temporal-protocol-context

run_plan:
  screening_seed_repetitions: 10
  seed_repetitions: 10
  confirmation_seed_repetitions: 30
  sensitivity: []
  backend_requirements:
    model_root: ../external/Drosophila_brain_model
    completeness: ../external/Drosophila_brain_model/2023_03_23_completeness_630_final.csv
    connectivity: ../external/Drosophila_brain_model/2023_03_23_connectivity_630_final.parquet
    annotation_file: ../drosophila-pd-neural-disease/annotations/flywire630_sensory_mn9_public.csv
    readout_ids:
      - "720575940660219265"
    trials: 1
    duration_s: 1.0
    id_namespace: flywire_root_id
    dataset_id: flywire-630-2023-03-23

metadata:
  experiment_id: E2
  scientific_scope: Computational temporal-protocol sensitivity; not a validated stimulus-dose or firing-to-behavior mapping.
  status: READY_FOR_COMPUTATIONAL_RUN
