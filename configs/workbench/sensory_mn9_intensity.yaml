name: sensory-mn9-input-intensity-v1
hypothesis: The computational MN9 response and candidate ordering depend on the declared intensity of the external sensory drive.
falsifiable_prediction: Sugar-input activation will increase the MN9 readout relative to the no-input control, while the magnitude and stability of the effect will be reported separately at 50, 150, and 200 Hz.
assay: sensory_mn9
primary_metric: metrics.readout_rates_hz.720575940660219265
backend: lif_2024

sugar_input_ids: &sugar_input_ids
  - "720575940624963786"
  - "720575940630233916"
  - "720575940637568838"
  - "720575940638202345"
  - "720575940617000768"
  - "720575940630797113"
  - "720575940632889389"
  - "720575940621754367"
  - "720575940621502051"
  - "720575940640649691"
  - "720575940639332736"
  - "720575940616885538"
  - "720575940639198653"
  - "720575940620900446"
  - "720575940617937543"
  - "720575940632425919"
  - "720575940633143833"
  - "720575940612670570"
  - "720575940628853239"
  - "720575940629176663"
  - "720575940611875570"

candidates:
  - candidate_id: no_intervention
    label: No-input computational control
    intervention:
      type: none
    expected_direction: unchanged
  - candidate_id: sugar_50hz
    label: Sugar input at 50 Hz
    target: public_sugar_grn_set
    intervention:
      type: activation
      parameters:
        input_ids: *sugar_input_ids
        stimulus_rate_hz: 50.0
    expected_direction: increase
  - candidate_id: sugar_150hz
    label: Sugar input at 150 Hz
    target: public_sugar_grn_set
    intervention:
      type: activation
      parameters:
        input_ids: *sugar_input_ids
        stimulus_rate_hz: 150.0
    expected_direction: increase
  - candidate_id: sugar_200hz
    label: Sugar input at 200 Hz
    target: public_sugar_grn_set
    intervention:
      type: activation
      parameters:
        input_ids: *sugar_input_ids
        stimulus_rate_hz: 200.0
    expected_direction: increase

controls:
  - id: no_intervention
    role: computational_negative_control
    note: This is a no-input model condition, not a retinal-negative animal.
  - id: paired_seed
    role: computational_pairing
    note: Every intensity is compared with the same seed-specific control.

sources:
  - citation: Shiu et al. 2024
    locator: https://www.nature.com/articles/s41586-024-07763-9
    status: public_reference
  - citation: Shiu et al. public model and notebook
    locator: https://github.com/philshiu/Drosophila_brain_model
    status: public_model_source

run_plan:
  screening_seed_repetitions: 10
  seed_repetitions: 10
  confirmation_seed_repetitions: 30
  sensitivity:
    - parameter: stimulus_rate_hz
      values: [50.0, 150.0, 200.0]
  backend_requirements:
    model_root: ../external/Drosophila_brain_model
    completeness: ../external/Drosophila_brain_model/2023_03_23_completeness_630_final.csv
    connectivity: ../external/Drosophila_brain_model/2023_03_23_connectivity_630_final.parquet
    annotation_file: ../drosophila-pd-neural/annotations/flywire630_sensory_mn9_public.csv
    readout_ids:
      - "720575940660219265"
    trials: 1
    duration_s: 1.0
    id_namespace: flywire_root_id
    dataset_id: flywire-630-2023-03-23

metadata:
  experiment_id: E1
  scientific_scope: Computational input-intensity sensitivity; not a sucrose-dose calibration and not a biological effect-size claim.
  status: READY_FOR_COMPUTATIONAL_RUN
